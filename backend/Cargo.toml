[workspace]
resolver = "2"
members = ["crates/domain", "crates/api"]

[workspace.package]
edition = "2021"
publish = false
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
uuid = { version = "1", features = ["v4", "serde"] }
